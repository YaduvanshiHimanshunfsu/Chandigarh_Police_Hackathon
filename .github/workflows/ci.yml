name: PratiBimb Praman CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Import Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install aiosqlite fakeredis pytest

      - name: Validate Backend Imports & Core Engines
        run: |
          export PYTHONPATH="backend"
          python -c "
          from app.core.config import settings
          from app.core.database import Base, engine
          from app.models.media_item import MediaItem
          from app.models.analysis_result import AnalysisResult
          from app.main import app
          print('CI_CHECK: All FastAPI endpoints & forensic models loaded cleanly!')
          "

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Next.js Dashboard
        working-directory: ./frontend
        run: npm run build
